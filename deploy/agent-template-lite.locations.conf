# EXTENSION: Replace public paths after naming and deployment topology are confirmed.
location /gateway/agent-template-lite/chat/ {
    proxy_pass http://127.0.0.1:3000/gateway/agent-template-lite/chat/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 180s;
}

location /gateway/agent-template-lite/console/ {
    proxy_pass http://127.0.0.1:3001/gateway/agent-template-lite/console/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
